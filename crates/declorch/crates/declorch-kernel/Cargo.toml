[package]
name = "declorch-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core kernel for the Declorch Agent OS"

[features]
default = ["memory"]
memory = ["declorch-memory", "declorch-runtime/memory"]

[dependencies]
declorch-types = { path = "../declorch-types" }
declorch-memory = { path = "../declorch-memory", optional = true }
declorch-runtime = { path = "../declorch-runtime", default-features = false }
declorch-skills = { path = "../declorch-skills" }
declorch-hands = { path = "../declorch-hands" }
declorch-extensions = { path = "../declorch-extensions" }
declorch-wire = { path = "../declorch-wire" }
declorch-channels = { path = "../declorch-channels" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dashmap = { workspace = true }
crossbeam = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
cron = "0.16"
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
