[package]
name = "darvium"
version = "0.1.0"
edition = "2021"
description = "Darvium: Crystallized Ecosystems of Knowledge and Capability — Workflow IR, GMR Retrieval, SearchWorkflow, Lifecycle/GC, Training Plane, Fusion"
license = "MIT"
repository = "https://github.com/t-kawata/darvium"

[features]
default = []
integration_llm = []
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:clap", "dep:futures-util", "dep:tokio-stream", "dep:parking_lot"]

[dependencies]
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
optimizer = "1.0.1"
axum = { version = "0.8.9", features = ["ws"], optional = true }
tokio = { version = "1.52.3", features = ["full"], optional = true }
tower-http = { version = "0.6.11", features = ["fs", "cors"], optional = true }
clap = { version = "4.6.1", features = ["derive"], optional = true }
futures-util = { version = "0.3.32", optional = true }
tokio-stream = { version = "0.1.18", features = ["sync"], optional = true }
parking_lot = { version = "0.12.5", optional = true }

[dev-dependencies]
proptest = "1"
rand = "0.9"
rstest = "0.25"

[lib]
name = "darvium"
path = "src/lib.rs"

[[bin]]
name = "darvium-observer"
path = "src/bin/observer.rs"
required-features = ["server"]
