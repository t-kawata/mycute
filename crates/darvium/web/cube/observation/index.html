<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Darvium Observer</title>
        <link rel="stylesheet" href="./style.css" />
        <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
        <script src="./script.js" defer></script>
    </head>
    <body>
        <div id="app"></div>

        <!-- コントロールパネル (左上) -->
        <div id="controls">
            <div id="connectionStatus">接続中...</div>
            <hr />
            <button id="startBtn">開始</button>
            <button id="stopBtn" disabled>停止</button>
            <button id="resetBtn">リセット</button>
            <hr />
            <label>
                人口
                <input
                    id="popSize"
                    type="number"
                    min="20"
                    max="500"
                    value="100"
                />
            </label>
            <label>
                最大Ticks
                <input
                    id="maxTicks"
                    type="number"
                    value="60"
                    min="10"
                    max="1000"
                />
            </label>
            <label>
                村サイズ目標
                <input
                    id="villageSize"
                    type="number"
                    value="50"
                    min="10"
                    max="500"
                />
            </label>
            <label>
                描画間隔 (ticks)
                <input
                    id="renderInterval"
                    type="number"
                    value="1"
                    min="1"
                    max="100"
                />
            </label>
            <label>
                成人 age ticks
                <input
                    id="adultAge"
                    type="number"
                    value="20"
                    min="1"
                    max="500"
                />
            </label>
            <label>
                首長引力強度
                <input
                    id="chiefAttraction"
                    type="number"
                    min="0.5"
                    max="5.0"
                    step="0.1"
                    value="3.0"
                />
            </label>
            <label>
                最小接近距離
                <input
                    id="minApproach"
                    type="number"
                    min="0.005"
                    max="0.200"
                    step="0.005"
                    value="0.01"
                />
            </label>
            <hr />
            <label>
                移動距離
                <input
                    id="movementDistance"
                    type="range"
                    min="0.001"
                    max="0.095"
                    step="0.001"
                    value="0.01"
                />
                <span id="movementDistanceVal">0.01</span>
            </label>
            <hr />
            <label>
                半径倍率
                <input
                    id="radiusScale"
                    type="range"
                    min="0.1"
                    max="5.0"
                    step="0.1"
                    value="0.1"
                />
                <span id="radiusScaleVal">0.1</span>
            </label>
            <hr />
        </div>

        <!-- 統計パネル (右上) -->
        <div id="stats">
            <table>
                <tr>
                    <td>Tick</td>
                    <td id="tickVal" class="value">0</td>
                </tr>
                <tr>
                    <td>人口</td>
                    <td id="popVal" class="value">0</td>
                </tr>
                <tr>
                    <td>子供</td>
                    <td id="childVal" class="value">0</td>
                </tr>
                <tr>
                    <td>出生</td>
                    <td id="birthVal" class="value">0</td>
                </tr>
                <tr>
                    <td>死亡</td>
                    <td id="deathVal" class="value">0</td>
                </tr>
                <tr>
                    <td>村</td>
                    <td id="villageVal" class="value">0</td>
                </tr>
                <tr>
                    <td>慈悲中央値</td>
                    <td id="benevolenceP50Val" class="value">0.000</td>
                </tr>
                <tr>
                    <td>首長性中央値</td>
                    <td id="chiefdomP50Val" class="value">0.000</td>
                </tr>
                <tr>
                    <td>首長数</td>
                    <td id="chiefCountVal" class="value">0</td>
                </tr>
            </table>
            <div id="densityList"></div>
        </div>
    </body>
</html>
