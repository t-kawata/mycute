[package]
name = "mycute"
version = "2.2.77"
edition = "2021"
default-run = "mycute"

# --- バイナリ定義 ---
# [[bin]] を明示的に定義することで、マルチバイナリ構成を有効化する。
[[bin]]
name = "mycute"
path = "src/main.rs"

# GUI非依存のスタンドアロンサーバーバイナリ。make server でビルドされる。
[[bin]]
name = "mycute-server"
path = "src/server.rs"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
# Note: objc2 APIs are used via direct FFI in this project
# The objc2 ecosystem is used only for demonstration in docs
# Actual implementation uses raw objc_msgSend calls
rdev = "0.5.3"
reqwest = { version = "0.11", features = [
    "blocking",
    "brotli",
    "gzip",
    "json",
    "stream",
] }
parking_lot = "0.12.1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
lazy_static = "1.4"
open = "5.3.3"

sherpa-rs = "0.6.8"
rubato = "0.16"
sherpa-rs-sys = "0.6.8"
lindera = { version = "2.0.1", features = ["embed-ipadic"] }
hound = "3.5.1"
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["clock"] }
edit-distance = "2.2.2"
fern = "0.7.1"
async-openai = { version = "0.32.3", features = ["audio"] }
indexmap = { version = "2.13.0", features = ["serde"] }
swarms-rs = "0.2.1"
tauri = { version = "2.9.5", features = [
    "custom-protocol",
    "macos-private-api",
] }
axum = { version = "0.8.8", features = ["multipart", "ws"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
sea-orm = { version = "1.1.19", features = [
    "debug-print",
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
] }
sea-orm-migration = { version = "1.1.19", features = [
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
bcrypt = "0.18.0"
tracing-subscriber = "0.3.22"
garde = { version = "0.22.1", features = ["derive", "full"] }
lbug = "0.15.1"
lindera-ipadic = "2.0.0"
dashmap = "6.1.0"
tokio-util = { version = "0.7.18", features = ["compat"] }
thiserror = "2.0.18"
ouroboros = "0.18.5"
rust_decimal = "1.40.0"
aes-gcm = "0.10.3"
hex = "0.4.3"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
once_cell = "1.21.3"
regex = "1.12.2"
walkdir = "2.5.0"
async-trait = "0.1.89"
futures = "0.3.31"
rodio = "0.21.1"
rand = "0.9.2"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
futures-util = "0.3.31"
tokio-rustls = "0.26.4"
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.19", features = ["full"] }
rustls-pemfile = "2.2.0"
fastcert = "0.3.1"
rcgen = "0.14.7"
base64 = "0.22.1"
rustls = { version = "0.23.36", features = ["ring"] }
local-ip-address = "0.6.10"
lol_html = "2.7.1"
http-body-util = "0.1.3"
ed448-goldilocks = "0.9.0"
zstd = "0.13.3"
tar = "0.4.44"
rust-embed = "8.11.0"
sha3 = "0.10.8"
x509-parser = "0.18.0"
argon2 = { version = "0.5.3", features = ["std", "password-hash"] }
semver = "1.0.27"
dirs = "6.0.0"
zip = "7.3.0"
tempfile = "3.24.0"
bincode = "1.3.3"
moka = { version = "0.12.13", features = ["future", "sync"] }
fd-lock = "4.0.4"
rust-s3 = "0.37.1"
winapi = { version = "0.3.9", features = ["winuser", "libloaderapi"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
reqwest-eventsource = "0.5.0"
tauri-plugin-process = "2.3.1"
arboard = "3.6.1"

# macOS specific dependencies (Objective-C/Cocoa FFI)
[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
objc = "0.2"
cocoa = "0.25"
core-foundation = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
# Dependencies here

[profile.release]
lto = true

[build-dependencies]
tauri-build = "2.5.3"

[dev-dependencies]
sea-orm = { version = "1.1.19", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }

[patch.crates-io]
lbug = { path = "crates/lbug/lbug-0.15.1" }
